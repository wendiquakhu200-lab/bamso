<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>順番発券システム</title>

<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Mono:wght@400;600&family=Noto+Sans:wght@400;700&display=swap" rel="stylesheet">

<style>
/* GIỮ NGUYÊN CSS CỦA BẠN → KHÔNG ĐỘNG VÀO */
</style>

</head>

<body>

<div class="ticker">
  <div class="ticker-inner">
    <span>🎯 いらっしゃいませ</span>
    <span>📋 整理券をお取りください</span>
    <span>⏳ 順番にご案内します</span>
    <span>🙏 お待ちいただきありがとうございます</span>
  </div>
</div>

<header>
  <div class="logo">QUEUE<span>SYSTEM</span></div>
  <div class="clock">
    <span id="date-display"></span>&nbsp;&nbsp;<span id="time">00:00:00</span>
  </div>
</header>

<div class="container">

  <div class="now-serving">
    <div class="now-label">呼び出し中番号</div>
    <div class="now-number" id="serving-num">---</div>
    <div class="waiting-count">待ち人数: <strong id="waiting-count">0</strong> 人</div>
  </div>

  <div class="take-btn-wrap">
    <button class="take-btn" onclick="openInfoForm()">🎫 整理券を取得</button>
  </div>

  <div class="grid">
    <div class="card">
      <div class="card-title">本日の統計</div>
      <div class="grid" style="gap:8px; margin:0">
        <div class="stat">
          <div class="stat-num" id="total-issued">0</div>
          <div class="stat-label">発行数</div>
        </div>
        <div class="stat">
          <div class="stat-num" id="total-served">0</div>
          <div class="stat-label">対応済</div>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="card-title">待ちリスト</div>
      <ul class="queue-list" id="queue-list">
        <li class="empty-queue">-- お客様はいません --</li>
      </ul>
    </div>
  </div>

  <div class="admin-section">
    <div class="admin-title">⚙ スタッフ操作</div>
    <div class="admin-btns">
      <button class="admin-btn next" onclick="callNext()">▶ 次の番号を呼ぶ</button>
      <button class="admin-btn reset" onclick="openPinModal()">🔒 リセット</button>
    </div>
  </div>

</div>

<!-- TICKET -->
<div class="ticket-popup" id="ticket-popup" onclick="closeTicketOutside(event)">
  <div class="ticket" id="ticket-card">
    <button class="ticket-close" onclick="closePopup()">✕</button>

<div id="step-form">
  <div class="ticket-header">📋 お客様情報</div>
  <div class="ticket-body">

    <div class="ticket-label">発券前に情報を入力してください</div>

    <div class="info-form" style="background:#fff; border-top:none; padding:0">

      <div class="info-field">
        <label>お名前 *</label>
        <input type="text" id="f-name" placeholder="山田 太郎" />
      </div>

      <div class="info-field">
        <label>電話番号</label>
        <input type="tel" id="f-phone" placeholder="090-xxxx-xxxx" />
      </div>

      <div class="info-row">
        <div class="info-field">
          <label>👨 大人</label>
          <div class="counter-wrap">
            <button class="counter-btn" onclick="changeCount('adult', -1)">−</button>
            <input class="counter-input" type="number" id="f-adult" value="1" readonly />
            <button class="counter-btn" onclick="changeCount('adult', 1)">+</button>
          </div>
        </div>

        <div class="info-field">
          <label>👶 子供</label>
          <div class="counter-wrap">
            <button class="counter-btn" onclick="changeCount('child', -1)">−</button>
            <input class="counter-input" type="number" id="f-child" value="0" readonly />
            <button class="counter-btn" onclick="changeCount('child', 1)">+</button>
          </div>
        </div>
      </div>

      <div class="info-field">
        <label>備考</label>
        <input type="text" id="f-note" placeholder="特記事項..." />
      </div>

    </div>

    <button class="confirm-btn" onclick="confirmAndTake()">✔ 確認して発券</button>
  </div>
</div>

<div id="step-ticket" style="display:none">
  <div class="ticket-header">★ 整理券 ★</div>
  <div class="ticket-body">

    <div class="ticket-label">あなたの番号</div>
    <div class="ticket-num" id="ticket-num">001</div>

    <hr class="ticket-divider">

    <div class="ticket-info">
      <div>👤 名前: <strong id="t-name"></strong></div>
      <div>📱 電話: <strong id="t-phone"></strong></div>
      <div>👨 大人: <strong id="t-adult"></strong> | 👶 子供: <strong id="t-child"></strong></div>
      <div>🕐 発券時間: <strong id="ticket-time"></strong></div>
      <div>⏳ 前に: <strong id="ticket-before"></strong> 人</div>
      <div>⌚ 待ち時間: <strong id="ticket-wait"></strong></div>
      <div id="t-note-row">📝 備考: <strong id="t-note"></strong></div>
    </div>

  </div>

  <div class="ticket-footer">この番号札を大切に保管してください</div>
</div>

</div>
</div>

<script>
let queue = [];
let currentServing = null;
let nextIssue = 1;
let totalServed = 0;

function updateUI() {
  document.getElementById('waiting-count').textContent =
    queue.filter(q => q.status === 'waiting').length;

  document.getElementById('total-issued').textContent = nextIssue - 1;
  document.getElementById('total-served').textContent = totalServed;

  const list = document.getElementById('queue-list');
  list.innerHTML = queue.map(q =>
    `<li>${q.num} - ${q.name}</li>`
  ).join('');
}

function openInfoForm() {
  const name = prompt("お名前を入力してください");
  if (!name) return;

  const num = nextIssue++;
  queue.push({ num, name, status: "waiting" });
  document.getElementById('ticket-num').textContent = num;
  document.getElementById('ticket-popup').style.display = "block";

  updateUI();
}

function callNext() {
  const next = queue.find(q => q.status === "waiting");
  if (!next) return alert("待ち客なし");

  next.status = "serving";
  currentServing = next.num;

  alert("番号 " + next.num + " を呼び出しました");
  updateUI();
}

function resetQueue() {
  queue = [];
  nextIssue = 1;
  totalServed = 0;
  updateUI();
}

setInterval(() => {
  const d = new Date();
  document.getElementById("time").textContent =
    d.toLocaleTimeString("ja-JP");
}, 1000);

updateUI();
</script>

</body>
</html>
