<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hệ Thống Lấy Số / 整理券</title>

<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Mono:wght@400;600&family=Noto+Sans:wght@400;700&display=swap" rel="stylesheet">

<style>
:root {
  --bg:#0a0a0a;
  --surface:#111;
  --border:#222;
  --accent:#f5c542;
  --accent2:#ff6b35;
  --text:#f0ede8;
  --muted:#666;
}

*{margin:0;padding:0;box-sizing:border-box}

body{
  background:var(--bg);
  color:var(--text);
  font-family:Noto Sans;
}

header{
  padding:20px;
  border-bottom:1px solid var(--border);
  display:flex;
  justify-content:space-between;
}

.logo{
  color:var(--accent);
  font-family:Bebas Neue;
  font-size:26px;
}

.container{
  max-width:900px;
  margin:auto;
  padding:20px;
  text-align:center;
}

/* NOW */
.now{
  padding:30px;
  border:1px solid var(--border);
  background:var(--surface);
  margin:20px 0;
}

.now-number{
  font-size:100px;
  color:var(--accent);
  font-family:Bebas Neue;
}

/* BUTTON */
button{
  padding:18px 50px;
  font-size:22px;
  background:var(--accent);
  border:none;
  cursor:pointer;
  margin:10px;
  font-family:Bebas Neue;
}

button:hover{
  background:var(--accent2);
}

/* QUEUE */
.list{
  margin-top:20px;
  text-align:left;
}

.item{
  padding:10px;
  border-bottom:1px solid #333;
  display:flex;
  justify-content:space-between;
  font-family:IBM Plex Mono;
}

.ja{
  font-size:12px;
  color:#aaa;
}
</style>
</head>

<body>

<header>
  <div class="logo">QUEUE SYSTEM / 整理券</div>
</header>

<div class="container">

  <div class="now">
    <div>現在呼び出し / Đang gọi</div>
    <div class="now-number" id="current">---</div>
  </div>

  <button id="takeBtn">🎫 LẤY SỐ / 番号取得</button>
  <button id="nextBtn">▶ GỌI TIẾP / 次呼ぶ</button>

  <div class="ja">待っている人数 / Số người chờ: <span id="waiting">0</span></div>

  <div class="list" id="list"></div>

</div>

<script>
let queue = [];
let current = null;
let next = 1;

/* FIX: bắt buộc global cho GitHub Pages */
window.takeNumber = takeNumber;
window.callNext = callNext;

/* lấy số */
document.getElementById("takeBtn").addEventListener("click", takeNumber);

function takeNumber(){
  queue.push(next++);
  update();
}

/* gọi số */
document.getElementById("nextBtn").addEventListener("click", callNext);

function callNext(){
  if(queue.length === 0){
    alert("Không còn ai / 誰もいません");
    return;
  }

  current = queue.shift();
  document.getElementById("current").innerText = current;
  update();
}

/* UI update */
function update(){
  document.getElementById("waiting").innerText = queue.length;

  let html = "";
  queue.forEach((n,i)=>{
    html += `
      <div class="item">
        <span>#${n}</span>
        <span class="ja">待ち</span>
      </div>
    `;
  });

  document.getElementById("list").innerHTML = html;
}
</script>

</body>
</html>
