<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>順番発券システム</title>

<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Mono:wght@400;600&family=Noto+Sans:wght@400;700&display=swap" rel="stylesheet">

<style>
  :root {
    --bg: #0a0a0a;
    --surface: #111111;
    --border: #222;
    --accent: #f5c542;
    --accent2: #ff6b35;
    --text: #f0ede8;
    --muted: #555;
    --success: #4caf50;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Noto Sans', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* TICKER */
  .ticker {
    background: var(--accent);
    color: #000;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 2px;
    padding: 6px 0;
    overflow: hidden;
    white-space: nowrap;
  }
  .ticker-inner {
    display: inline-block;
    animation: ticker 20s linear infinite;
  }
  .ticker-inner span { margin: 0 40px; }
  @keyframes ticker { from { transform: translateX(0); } to { transform: translateX(-50%); } }

  /* HEADER */
  header {
    padding: 24px 40px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid var(--border);
  }
  .logo {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 28px;
    letter-spacing: 4px;
    color: var(--accent);
  }
  .logo span { color: var(--text); }
  .clock {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 14px;
    color: var(--muted);
    letter-spacing: 1px;
  }
  .clock #time { color: var(--accent); font-size: 16px; }

  /* MAIN */
  .container {
    max-width: 900px;
    margin: 0 auto;
    padding: 40px 24px;
  }

  /* BIG NUMBER DISPLAY */
  .now-serving {
    text-align: center;
    margin-bottom: 48px;
    padding: 40px;
    border: 1px solid var(--border);
    position: relative;
    overflow: hidden;
    background: var(--surface);
  }
  .now-serving::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: linear-gradient(90deg, var(--accent2), var(--accent), var(--accent2));
    background-size: 200% 100%;
    animation: shimmer 2s linear infinite;
  }
  @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

  .now-label {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    letter-spacing: 4px;
    color: var(--muted);
    text-transform: uppercase;
    margin-bottom: 12px;
  }
  .now-number {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 120px;
    line-height: 1;
    color: var(--accent);
    text-shadow: 0 0 60px rgba(245,197,66,0.3);
    transition: all 0.4s ease;
    animation: pulse-glow 3s ease-in-out infinite;
  }
  @keyframes pulse-glow {
    0%, 100% { text-shadow: 0 0 40px rgba(245,197,66,0.2); }
    50% { text-shadow: 0 0 80px rgba(245,197,66,0.5); }
  }
  .now-number.flash {
    animation: flash-anim 0.5s ease;
  }
  @keyframes flash-anim {
    0% { transform: scale(1); }
    30% { transform: scale(1.08); color: #fff; }
    100% { transform: scale(1); }
  }
  .waiting-count {
    margin-top: 16px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13px;
    color: var(--muted);
  }
  .waiting-count strong { color: var(--accent2); }

  /* TAKE NUMBER BTN */
  .take-btn-wrap { text-align: center; margin-bottom: 48px; }
  .take-btn {
    background: var(--accent);
    color: #000;
    border: none;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 28px;
    letter-spacing: 4px;
    padding: 20px 60px;
    cursor: pointer;
    position: relative;
    overflow: hidden;
    transition: transform 0.1s ease, box-shadow 0.2s ease;
    box-shadow: 4px 4px 0px var(--accent2);
  }
  .take-btn:hover {
    transform: translate(-2px, -2px);
    box-shadow: 6px 6px 0px var(--accent2);
  }
  .take-btn:active {
    transform: translate(2px, 2px);
    box-shadow: 2px 2px 0px var(--accent2);
  }

  /* TICKET POPUP */
  .ticket-popup {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.85);
    z-index: 100;
    align-items: center;
    justify-content: center;
    backdrop-filter: blur(4px);
  }
  .ticket-popup.show { display: flex; }
  .ticket {
    background: #fff;
    color: #000;
    width: 340px;
    position: relative;
    animation: pop-in 0.4s cubic-bezier(0.175,0.885,0.32,1.275);
    overflow: hidden;
  }
  @keyframes pop-in {
    from { transform: scale(0.6) rotate(-4deg); opacity: 0; }
    to   { transform: scale(1) rotate(0deg); opacity: 1; }
  }
  .ticket-header {
    background: #0a0a0a;
    color: var(--accent);
    font-family: 'Bebas Neue', sans-serif;
    font-size: 14px;
    letter-spacing: 4px;
    text-align: center;
    padding: 12px;
  }
  .ticket-body { padding: 24px; text-align: center; }
  .ticket-label {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    letter-spacing: 3px;
    color: #888;
    text-transform: uppercase;
    margin-bottom: 8px;
  }
  .ticket-num {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 96px;
    line-height: 1;
    color: #0a0a0a;
  }
  .ticket-info {
    margin-top: 16px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    color: #555;
    line-height: 2;
    text-align: left;
  }
  .ticket-info strong { color: #000; }
  .ticket-divider {
    border: none;
    border-top: 2px dashed #ddd;
    margin: 16px 0;
  }
  .ticket-footer {
    background: #f5f5f5;
    padding: 14px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    color: #aaa;
    text-align: center;
    letter-spacing: 1px;
  }
  .ticket-close {
    position: absolute;
    top: 10px; right: 10px;
    background: none;
    border: none;
    font-size: 18px;
    color: var(--accent);
    cursor: pointer;
    line-height: 1;
    padding: 4px;
  }

  /* CUSTOMER INFO FORM inside ticket popup */
  .info-form {
    background: #f9f9f9;
    border-top: 2px dashed #ddd;
    padding: 20px 24px;
    text-align: left;
  }
  .info-form-title {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    letter-spacing: 3px;
    color: #888;
    text-transform: uppercase;
    margin-bottom: 14px;
  }
  .info-row {
    display: flex;
    gap: 10px;
    margin-bottom: 10px;
  }
  .info-field {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .info-field label {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    letter-spacing: 1px;
    color: #888;
    text-transform: uppercase;
  }
  .info-field input {
    padding: 8px 10px;
    border: 1px solid #ddd;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13px;
    background: #fff;
    color: #000;
    outline: none;
    transition: border-color 0.2s;
    width: 100%;
  }
  .info-field input:focus { border-color: #f5c542; }
  .info-field input.count-input { text-align: center; font-size: 16px; font-weight: 600; }

  .counter-wrap {
    display: flex;
    align-items: center;
    gap: 0;
  }
  .counter-btn {
    width: 32px;
    height: 36px;
    background: #222;
    color: #fff;
    border: none;
    font-size: 18px;
    cursor: pointer;
    font-family: 'Bebas Neue', sans-serif;
    transition: background 0.15s;
    flex-shrink: 0;
  }
  .counter-btn:hover { background: #f5c542; color: #000; }
  .counter-input {
    width: 48px;
    text-align: center;
    padding: 6px 4px;
    border: 1px solid #ddd;
    border-left: none;
    border-right: none;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 16px;
    font-weight: 600;
    color: #000;
    background: #fff;
    outline: none;
  }

  .confirm-btn {
    width: 100%;
    margin-top: 14px;
    padding: 12px;
    background: #0a0a0a;
    color: var(--accent);
    border: none;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 18px;
    letter-spacing: 3px;
    cursor: pointer;
    transition: background 0.2s;
  }
  .confirm-btn:hover { background: #f5c542; color: #000; }

  /* GRID */
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 32px; }
  @media (max-width: 600px) {
    .grid { grid-template-columns: 1fr; }
    .now-number { font-size: 80px; }
    header { padding: 16px 20px; }
    .take-btn { font-size: 22px; padding: 16px 32px; }
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    padding: 24px;
  }
  .card-title {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    letter-spacing: 3px;
    color: var(--muted);
    text-transform: uppercase;
    margin-bottom: 16px;
  }

  /* QUEUE LIST */
  .queue-list { list-style: none; max-height: 220px; overflow-y: auto; }
  .queue-list::-webkit-scrollbar { width: 4px; }
  .queue-list::-webkit-scrollbar-track { background: transparent; }
  .queue-list::-webkit-scrollbar-thumb { background: var(--border); }
  .queue-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 0;
    border-bottom: 1px solid var(--border);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    animation: slide-in 0.3s ease;
  }
  @keyframes slide-in {
    from { opacity: 0; transform: translateX(-10px); }
    to   { opacity: 1; transform: translateX(0); }
  }
  .queue-item:last-child { border-bottom: none; }
  .q-num {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 20px;
    color: var(--accent);
    min-width: 40px;
  }
  .q-num.active { color: var(--accent2); }
  .q-status {
    font-size: 10px;
    letter-spacing: 2px;
    padding: 2px 6px;
    border: 1px solid;
  }
  .q-status.waiting { color: var(--muted); border-color: var(--muted); }
  .q-status.serving { color: var(--accent2); border-color: var(--accent2); background: rgba(255,107,53,0.1); }
  .q-info { font-size: 10px; color: #888; line-height: 1.4; }
  .q-time { margin-left: auto; color: var(--muted); font-size: 10px; }

  /* ADMIN */
  .admin-section {
    background: var(--surface);
    border: 1px solid var(--border);
    padding: 24px;
    margin-bottom: 32px;
  }
  .admin-title {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    letter-spacing: 3px;
    color: var(--muted);
    text-transform: uppercase;
    margin-bottom: 16px;
  }
  .admin-btns { display: flex; gap: 12px; flex-wrap: wrap; }
  .admin-btn {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    letter-spacing: 2px;
    padding: 10px 20px;
    border: 1px solid;
    background: none;
    cursor: pointer;
    transition: all 0.2s;
    text-transform: uppercase;
  }
  .admin-btn.next { color: var(--success); border-color: var(--success); }
  .admin-btn.next:hover { background: rgba(76,175,80,0.15); }
  .admin-btn.reset { color: var(--accent2); border-color: var(--accent2); }
  .admin-btn.reset:hover { background: rgba(255,107,53,0.15); }

  /* STATS */
  .stat { text-align: center; }
  .stat-num {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 48px;
    color: var(--text);
    line-height: 1;
  }
  .stat-label {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    letter-spacing: 2px;
    color: var(--muted);
    margin-top: 4px;
  }

  /* NOTIFY BANNER */
  .notify {
    position: fixed;
    bottom: 24px; right: 24px;
    background: var(--surface);
    border: 1px solid var(--accent);
    border-left: 4px solid var(--accent);
    padding: 14px 20px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    color: var(--text);
    max-width: 280px;
    animation: slide-up 0.3s ease;
    z-index: 200;
    display: none;
  }
  .notify.show { display: block; }
  @keyframes slide-up {
    from { transform: translateY(20px); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
  }
  .notify strong { color: var(--accent); display: block; margin-bottom: 4px; letter-spacing: 2px; }

  .empty-queue {
    text-align: center;
    padding: 20px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    color: var(--muted);
    letter-spacing: 2px;
  }

  /* PIN MODAL */
  .pin-modal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.9);
    z-index: 300;
    align-items: center;
    justify-content: center;
    backdrop-filter: blur(6px);
  }
  .pin-modal.show { display: flex; }
  .pin-box {
    background: var(--surface);
    border: 1px solid var(--border);
    border-top: 3px solid var(--accent2);
    padding: 40px 36px;
    width: 320px;
    text-align: center;
    animation: pop-in 0.3s cubic-bezier(0.175,0.885,0.32,1.275);
  }
  .pin-icon { font-size: 32px; margin-bottom: 12px; }
  .pin-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 22px;
    letter-spacing: 4px;
    color: var(--accent2);
    margin-bottom: 6px;
  }
  .pin-sub {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 2px;
    margin-bottom: 24px;
  }
  .pin-dots {
    display: flex;
    justify-content: center;
    gap: 12px;
    margin-bottom: 24px;
  }
  .pin-dot {
    width: 14px;
    height: 14px;
    border: 2px solid var(--muted);
    border-radius: 50%;
    transition: all 0.2s;
  }
  .pin-dot.filled { background: var(--accent); border-color: var(--accent); }
  .pin-dot.error { background: var(--accent2); border-color: var(--accent2); animation: shake 0.3s ease; }
  @keyframes shake {
    0%,100% { transform: translateX(0); }
    25% { transform: translateX(-6px); }
    75% { transform: translateX(6px); }
  }
  .pin-keypad {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    margin-bottom: 16px;
  }
  .pin-key {
    padding: 14px;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: 'Bebas Neue', sans-serif;
    font-size: 22px;
    cursor: pointer;
    transition: all 0.15s;
    letter-spacing: 1px;
  }
  .pin-key:hover { background: var(--accent); color: #000; border-color: var(--accent); }
  .pin-key:active { transform: scale(0.95); }
  .pin-key.del { color: var(--accent2); font-size: 16px; }
  .pin-key.cancel { color: var(--muted); font-size: 13px; font-family: 'IBM Plex Mono', monospace; letter-spacing: 1px; }
  .pin-error-msg {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--accent2);
    letter-spacing: 1px;
    min-height: 16px;
  }
</style>
</head>

<body>

<!-- NOTIFY (FIX THIẾU) -->
<div class="notify" id="notify">
  <strong id="notify-title"></strong>
  <span id="notify-msg"></span>
</div>

<div class="ticker">
  <div class="ticker-inner">
    <span>🎯 ようこそお客様</span>
    <span>📋 順番札をお取りください</span>
    <span>⏳ 順番にご案内いたします</span>
    <span>🙏 お待ちいただきありがとうございます</span>
  </div>
</div>

<header>
  <div class="logo">QUEUE<span>SYSTEM</span></div>
  <div class="clock">
    <span id="date-display"></span>&nbsp;&nbsp;<span id="time">00:00:00</span>
  </div>
</header>

<div class="container">

  <div class="now-serving">
    <div class="now-label">現在ご案内中の番号</div>
    <div class="now-number" id="serving-num">---</div>
    <div class="waiting-count">待ち人数: <strong id="waiting-count">0</strong> 人</div>
  </div>

  <div class="take-btn-wrap">
    <button class="take-btn" onclick="openInfoForm()">🎫 順番を取る</button>
  </div>

  <div class="admin-section">
    <div class="admin-title">⚙ スタッフ操作</div>
    <div class="admin-btns">
      <button class="admin-btn next" onclick="callNext()">▶ 次を呼ぶ</button>
      <button class="admin-btn reset" onclick="openPinModal()">🔒 リセット</button>
    </div>
  </div>

</div>

<!-- TICKET -->
<div class="ticket-popup" id="ticket-popup">
  <div class="ticket">

    <button class="ticket-close" onclick="closePopup()">✕</button>

    <div id="step-form">
      <div class="ticket-header">📋 お客様情報</div>

      <div class="ticket-body">

        <input id="f-name" placeholder="名前"><br><br>
        <input id="f-phone" placeholder="電話"><br><br>

        <button onclick="changeCount('adult',-1)">-</button>
        <input id="f-adult" value="1" readonly>
        <button onclick="changeCount('adult',1)">+</button>

        <br><br>

        <button onclick="changeCount('child',-1)">-</button>
        <input id="f-child" value="0" readonly>
        <button onclick="changeCount('child',1)">+</button>

        <br><br>

        <button onclick="confirmAndTake()">OK</button>
      </div>
    </div>

    <div id="step-ticket" style="display:none">
      <div class="ticket-header">★ TICKET ★</div>
      <div class="ticket-body">
        <div class="ticket-num" id="ticket-num">001</div>
        <div id="t-name"></div>
      </div>
    </div>

  </div>
</div>

<!-- PIN MODAL (FIX FULL) -->
<div class="pin-modal" id="pin-modal">
  <div class="pin-box">

    <div class="pin-title">PIN</div>

    <div class="pin-dots">
      <div class="pin-dot" id="dot-0"></div>
      <div class="pin-dot" id="dot-1"></div>
      <div class="pin-dot" id="dot-2"></div>
      <div class="pin-dot" id="dot-3"></div>
    </div>

    <div class="pin-keypad">
      <button class="pin-key" onclick="pinPress('1')">1</button>
      <button class="pin-key" onclick="pinPress('2')">2</button>
      <button class="pin-key" onclick="pinPress('3')">3</button>
      <button class="pin-key" onclick="pinPress('4')">4</button>
      <button class="pin-key" onclick="pinPress('5')">5</button>
      <button class="pin-key" onclick="pinPress('6')">6</button>
      <button class="pin-key" onclick="pinPress('7')">7</button>
      <button class="pin-key" onclick="pinPress('8')">8</button>
      <button class="pin-key" onclick="pinPress('9')">9</button>
      <button class="pin-key del" onclick="pinDel()">⌫</button>
      <button class="pin-key" onclick="pinPress('0')">0</button>
      <button class="pin-key cancel" onclick="closePinModal()">✕</button>
    </div>

    <div class="pin-error-msg" id="pin-error"></div>

  </div>
</div>

<script>
// ================= CONFIG =================
const RESET_PIN = "1234";

let queue = [];
let nextIssue = 1;
let currentServing = null;
let totalServed = 0;
let pinBuffer = "";

// ================= CLOCK =================
setInterval(() => {
  const d = new Date();
  document.getElementById("time").textContent =
    d.toLocaleTimeString("ja-JP");
}, 1000);

// ================= UI =================
function updateUI(){
  document.getElementById("waiting-count").textContent =
    queue.filter(x=>x.status==="waiting").length;

  document.getElementById("serving-num").textContent =
    currentServing ?? "---";
}

// ================= NOTIFY =================
function showNotify(t,m){
  document.getElementById("notify-title").textContent=t;
  document.getElementById("notify-msg").textContent=m;
  const el=document.getElementById("notify");
  el.classList.add("show");
  setTimeout(()=>el.classList.remove("show"),3000);
}

// ================= QUEUE =================
function openInfoForm(){
  document.getElementById("ticket-popup").classList.add("show");
  document.getElementById("step-form").style.display="block";
  document.getElementById("step-ticket").style.display="none";
}

function confirmAndTake(){
  const name=document.getElementById("f-name").value;
  const num=nextIssue++;

  queue.push({num,name,status:"waiting"});
  document.getElementById("ticket-num").textContent=num;
  document.getElementById("t-name").textContent=name;

  document.getElementById("step-form").style.display="none";
  document.getElementById("step-ticket").style.display="block";

  updateUI();
}

function callNext(){
  const next=queue.find(q=>q.status==="waiting");
  if(!next){ showNotify("INFO","No queue"); return;}

  next.status="done";
  currentServing=next.num;

  showNotify("CALL","番号 "+next.num);
  updateUI();
}

// ================= PIN =================
function openPinModal(){
  pinBuffer="";
  document.getElementById("pin-modal").classList.add("show");
}
function closePinModal(){
  document.getElementById("pin-modal").classList.remove("show");
}
function pinPress(n){
  if(pinBuffer.length<4) pinBuffer+=n;
  drawPin();
  if(pinBuffer.length===4){
    if(pinBuffer===RESET_PIN){
      queue=[];
      currentServing=null;
      updateUI();
      closePinModal();
      showNotify("RESET","Done");
    }else{
      document.getElementById("pin-error").textContent="Wrong PIN";
    }
  }
}
function pinDel(){
  pinBuffer=pinBuffer.slice(0,-1);
  drawPin();
}
function drawPin(){
  for(let i=0;i<4;i++){
    document.getElementById("dot-"+i).className=
      i<pinBuffer.length?"pin-dot filled":"pin-dot";
  }
}

// ================= CLOSE =================
function closePopup(){
  document.getElementById("ticket-popup").classList.remove("show");
}

updateUI();
</script>

</body>
