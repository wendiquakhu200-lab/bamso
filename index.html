<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>順番整理システム</title>

<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Mono:wght@400;600&family=Noto+Sans:wght@400;700&display=swap" rel="stylesheet">

<style>
:root {
  --bg: #0a0a0a;
  --surface: #111111;
  --border: #222;
  --accent: #f5c542;
  --accent2: #ff6b35;
  --text: #f0ede8;
  --muted: #555;
  --success: #4caf50;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Noto Sans', sans-serif;
  min-height: 100vh;
  overflow-x: hidden;
}

/* TICKER */
.ticker {
  background: var(--accent);
  color: #000;
  font-family: 'IBM Plex Mono', monospace;
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 2px;
  padding: 6px 0;
  overflow: hidden;
  white-space: nowrap;
}
.ticker-inner {
  display: inline-block;
  animation: ticker 20s linear infinite;
}
.ticker-inner span { margin: 0 40px; }
@keyframes ticker {
  from { transform: translateX(0); }
  to { transform: translateX(-50%); }
}

/* HEADER */
header {
  padding: 24px 40px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1px solid var(--border);
}
.logo {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 28px;
  letter-spacing: 4px;
  color: var(--accent);
}
.logo span { color: var(--text); }

.clock {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 14px;
  color: var(--muted);
}

/* MAIN */
.container {
  max-width: 900px;
  margin: 0 auto;
  padding: 40px 24px;
}

/* NOW */
.now-serving {
  text-align: center;
  margin-bottom: 48px;
  padding: 40px;
  border: 1px solid var(--border);
  background: var(--surface);
}
.now-label {
  font-family: 'IBM Plex Mono';
  font-size: 11px;
  letter-spacing: 4px;
  color: var(--muted);
}
.now-number {
  font-family: 'Bebas Neue';
  font-size: 120px;
  color: var(--accent);
}
.waiting-count {
  font-family: 'IBM Plex Mono';
  font-size: 13px;
  color: var(--muted);
}

/* BUTTON */
.take-btn {
  background: var(--accent);
  color: #000;
  border: none;
  font-family: 'Bebas Neue';
  font-size: 28px;
  padding: 20px 60px;
  cursor: pointer;
}

/* CARD */
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  padding: 24px;
}
.card-title {
  font-family: 'IBM Plex Mono';
  font-size: 10px;
  letter-spacing: 3px;
  color: var(--muted);
}

/* QUEUE */
.queue-item {
  font-family: 'IBM Plex Mono';
  font-size: 12px;
}

/* ADMIN */
.admin-title {
  font-family: 'IBM Plex Mono';
  font-size: 10px;
  color: var(--muted);
}

/* TICKET */
.ticket-header {
  background: #0a0a0a;
  color: var(--accent);
  text-align: center;
  padding: 12px;
}
.ticket-label {
  font-family: 'IBM Plex Mono';
  font-size: 11px;
  color: #888;
}
.ticket-num {
  font-family: 'Bebas Neue';
  font-size: 96px;
}
.ticket-footer {
  font-family: 'IBM Plex Mono';
  font-size: 10px;
  color: #aaa;
  text-align: center;
}

/* PIN */
.pin-title {
  font-family: 'Bebas Neue';
  color: var(--accent2);
}
.pin-sub {
  font-family: 'IBM Plex Mono';
  color: var(--muted);
}
</style>
</head>

<body>

<div class="ticker">
  <div class="ticker-inner">
    <span>🎯 いらっしゃいませ</span>
    <span>📋 整理券をお取りください</span>
    <span>⏳ 順番にご案内いたします</span>
    <span>🙏 お待ちいただきありがとうございます</span>
  </div>
</div>

<header>
  <div class="logo">順番<span>システム</span></div>
  <div class="clock">
    <span id="date-display"></span> <span id="time"></span>
  </div>
</header>

<div class="container">

  <div class="now-serving">
    <div class="now-label">現在ご案内中</div>
    <div class="now-number" id="serving-num">---</div>
    <div class="waiting-count">待ち人数: <strong id="waiting-count">0</strong>人</div>
  </div>

  <div style="text-align:center; margin-bottom:40px;">
    <button class="take-btn" onclick="openInfoForm()">🎫 整理券を取る</button>
  </div>

  <div class="card">
    <div class="card-title">本日の統計</div>
    <div>発行数: <span id="total-issued">0</span></div>
    <div>対応済み: <span id="total-served">0</span></div>
  </div>

  <div class="card" style="margin-top:20px;">
    <div class="card-title">待ちリスト</div>
    <ul id="queue-list"></ul>
  </div>

  <div class="card" style="margin-top:20px;">
    <div class="admin-title">スタッフ操作</div>
    <button onclick="callNext()">▶ 次を呼び出す</button>
    <button onclick="resetQueue()">🔒 リセット</button>
  </div>

</div>

<!-- POPUP -->
<div id="ticket-popup" style="display:none;">
  <div class="ticket-header">整理券</div>

  <div class="ticket-label">あなたの番号</div>
  <div class="ticket-num" id="ticket-num">001</div>

  <div class="ticket-footer">
    この券をお持ちください
  </div>
</div>

<script>
let queue = [];
let currentServing = null;
let nextIssue = 1;
let totalServed = 0;

function updateUI() {
  document.getElementById('waiting-count').textContent =
    queue.filter(q => q.status === 'waiting').length;

  document.getElementById('total-issued').textContent = nextIssue - 1;
  document.getElementById('total-served').textContent = totalServed;

  const list = document.getElementById('queue-list');
  list.innerHTML = queue.map(q =>
    `<li>${q.num} - ${q.name}</li>`
  ).join('');
}

function openInfoForm() {
  const name = prompt("お名前を入力してください");
  if (!name) return;

  const num = nextIssue++;
  queue.push({ num, name, status: "waiting" });
  document.getElementById('ticket-num').textContent = num;
  document.getElementById('ticket-popup').style.display = "block";

  updateUI();
}

function callNext() {
  const next = queue.find(q => q.status === "waiting");
  if (!next) return alert("待ち客なし");

  next.status = "serving";
  currentServing = next.num;

  alert("番号 " + next.num + " を呼び出しました");
  updateUI();
}

function resetQueue() {
  queue = [];
  nextIssue = 1;
  totalServed = 0;
  updateUI();
}

setInterval(() => {
  const d = new Date();
  document.getElementById("time").textContent =
    d.toLocaleTimeString("ja-JP");
}, 1000);

updateUI();
</script>

</body>
</html>
