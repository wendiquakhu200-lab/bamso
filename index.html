<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>順番発券システム</title>

<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Mono:wght@400;600&family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">

<style>
  :root {
    --bg: #0a0a0a;
    --surface: #111111;
    --border: #222;
    --accent: #f5c542;
    --accent2: #ff6b35;
    --text: #f0ede8;
    --muted: #555;
    --success: #4caf50;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Noto Sans JP', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  .ticker {
    background: var(--accent);
    color: #000;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 2px;
    padding: 6px 0;
    overflow: hidden;
    white-space: nowrap;
  }

  .ticker-inner {
    display: inline-block;
    animation: ticker 20s linear infinite;
  }

  .ticker-inner span { margin: 0 40px; }

  @keyframes ticker {
    from { transform: translateX(0); }
    to { transform: translateX(-50%); }
  }

  header {
    padding: 24px 40px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid var(--border);
  }

  .logo {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 28px;
    letter-spacing: 4px;
    color: var(--accent);
  }

  .logo span { color: var(--text); }

  .clock {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 14px;
    color: var(--muted);
  }

  .container {
    max-width: 900px;
    margin: 0 auto;
    padding: 40px 24px;
  }

  .now-serving {
    text-align: center;
    padding: 40px;
    border: 1px solid var(--border);
    background: var(--surface);
  }

  .now-label {
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 3px;
    margin-bottom: 10px;
  }

  .now-number {
    font-size: 120px;
    font-family: 'Bebas Neue', sans-serif;
    color: var(--accent);
  }

  .take-btn {
    background: var(--accent);
    color: #000;
    font-size: 24px;
    padding: 18px 50px;
    border: none;
    cursor: pointer;
    font-family: 'Bebas Neue', sans-serif;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    padding: 20px;
    margin-top: 20px;
  }

  .card-title {
    font-size: 10px;
    color: var(--muted);
    letter-spacing: 2px;
    margin-bottom: 10px;
  }

  .queue-item {
    display: flex;
    justify-content: space-between;
    padding: 8px 0;
    border-bottom: 1px solid var(--border);
    font-size: 12px;
  }

  .q-num {
    color: var(--accent);
    font-family: 'Bebas Neue';
    font-size: 20px;
  }

  .q-status.waiting { color: var(--muted); }
  .q-status.serving { color: var(--accent2); }

  .ticket-popup {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.85);
    align-items: center;
    justify-content: center;
  }

  .ticket-popup.show { display: flex; }

  .ticket {
    background: #fff;
    color: #000;
    width: 320px;
    padding: 20px;
  }

  .ticket-header {
    text-align: center;
    font-family: 'Bebas Neue';
    background: #000;
    color: var(--accent);
    padding: 10px;
  }

  .ticket-num {
    font-size: 90px;
    text-align: center;
  }

  .ticket-info {
    font-size: 12px;
    line-height: 1.8;
  }

  .notify {
    position: fixed;
    bottom: 20px;
    right: 20px;
    background: #111;
    border-left: 4px solid var(--accent);
    padding: 12px;
    display: none;
  }

  .notify.show { display: block; }
</style>
</head>

<body>

<div class="ticker">
  <div class="ticker-inner">
    <span>🎌 いらっしゃいませ</span>
    <span>📋 整理券をお取りください</span>
    <span>⏳ 順番にご案内いたします</span>
    <span>🙏 お待ちいただきありがとうございます</span>
  </div>
</div>

<header>
  <div class="logo">QUEUE<span>SYSTEM</span></div>
  <div class="clock"><span id="time"></span></div>
</header>

<div class="container">

  <div class="now-serving">
    <div class="now-label">現在の呼び出し番号</div>
    <div class="now-number" id="serving-num">---</div>
  </div>

  <div style="text-align:center; margin:20px 0;">
    <button class="take-btn" onclick="takeNumber()">番号を取得</button>
  </div>

  <div class="card">
    <div class="card-title">待ちリスト</div>
    <div id="queue"></div>
  </div>

</div>

<div class="ticket-popup" id="ticket">
  <div class="ticket">
    <div class="ticket-header">整理券</div>
    <div class="ticket-num" id="ticket-num">001</div>
    <div class="ticket-info">
      時間: <span id="t-time"></span><br>
      待ち人数: <span id="t-wait"></span>
    </div>
  </div>
</div>

<div class="notify" id="notify"></div>

<script>
let queue = [];
let next = 1;
let current = null;

function time() {
  const d = new Date();
  return d.getHours()+":"+String(d.getMinutes()).padStart(2,'0');
}

function update() {
  document.getElementById("serving-num").innerText = current ?? "---";

  document.getElementById("queue").innerHTML =
    queue.map(q =>
      `<div class="queue-item">
        <span class="q-num">${q.num}</span>
        <span class="q-status ${q.status}">
          ${q.status=="waiting"?"待機中":"呼出中"}
        </span>
      </div>`
    ).join("");
}

function takeNumber() {
  const num = next++;
  queue.push({num, status:"waiting"});
  document.getElementById("ticket-num").innerText = num;
  document.getElementById("t-time").innerText = time();
  document.getElementById("t-wait").innerText = queue.length;
  document.getElementById("ticket").classList.add("show");
  update();
}

setInterval(()=>{
  const d=new Date();
  document.getElementById("time").innerText =
    d.getHours()+":"+String(d.getMinutes()).padStart(2,'0')+":"+String(d.getSeconds()).padStart(2,'0');
},1000);

update();
</script>

</body>
</html>
