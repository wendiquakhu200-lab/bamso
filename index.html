<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Test Queue</title>
</head>

<body style="text-align:center;margin-top:100px">

<h2>TEST BUTTON</h2>

<button onclick="getNumber()" style="font-size:25px">
Lấy số
</button>

<h3 id="your">---</h3>

<script>
let num = 0;

function getNumber() {
  num = num + 1;

  alert("CLICK OK - số = " + num);

  document.getElementById("your").innerText =
    "Số của bạn: " + num;

  console.log("clicked", num);
}
</script>

</body>
</html>
